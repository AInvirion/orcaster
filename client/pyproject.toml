[project]
name = "orcaster-worker"
version = "2.0.1"
description = "Orcaster worker: claims tasks from an Orcaster server, runs them and reports the results"
readme = "README.pypi.md"
license = "Apache-2.0"
authors = [{ name = "AInvirion LLC" }]
keywords = ["orcaster", "task-queue", "worker", "distributed"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "cryptography>=44",
    "psutil>=6",
]

[project.urls]
Homepage = "https://github.com/AInvirion/orcaster"
Source = "https://github.com/AInvirion/orcaster"
Issues = "https://github.com/AInvirion/orcaster/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
orcaster-worker = "orcaster_worker.main:cli_entry"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcaster_worker"]

# Public sdist: only what is needed to build the wheel. No tests/, .env.example
# or internal README.md; hatch adds pyproject.toml and the declared readme.
[tool.hatch.build.targets.sdist]
only-include = ["src/orcaster_worker", "pyproject.toml", "README.pypi.md"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests against a real running server (skipped by default)",
]
