name: CLA Auto Sign

# Records a CLA signature by committing the signer to .clabot on the default
# branch. The ruleset on the default branch requires pull requests, so this push
# succeeds only when the ruleset lists the GitHub Actions app as a bypass actor
# (repository settings, Rules, Rulesets, main, Bypass list). Without the bypass
# the push is rejected; the job then fails and comments on the pull request that
# the signature was not recorded, so a maintainer adds the signer to .clabot
# through a pull request. A signature is never dropped silently.

on:
  issue_comment:
    types: [created]

# No permissions by default; the job below asks only for what it uses.
permissions: {}

jobs:
  auto-sign:
    if: github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the Contributor License Agreement and I hereby accept the terms')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add contributor to CLA whitelist
        id: add-contributor
        env:
          CONTRIBUTOR: ${{ github.event.comment.user.login }}
        run: |
          if jq -e --arg user "$CONTRIBUTOR" '.contributors | index($user)' .clabot > /dev/null 2>&1; then
            echo "already_signed=true" >> "$GITHUB_OUTPUT"
          else
            jq --arg user "$CONTRIBUTOR" '.contributors += [$user]' .clabot > .clabot.tmp
            mv .clabot.tmp .clabot
            echo "already_signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        id: push
        if: steps.add-contributor.outputs.already_signed == 'false'
        env:
          CONTRIBUTOR: ${{ github.event.comment.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .clabot
          git commit -m "chore: add $CONTRIBUTOR to CLA contributors [skip ci]"
          # Two signers at once race on the same file: rebase and retry twice.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "::warning::push attempt $attempt rejected"
            git pull --rebase || break
          done
          echo "::error::the signature of $CONTRIBUTOR was not recorded: push to the default branch rejected (missing ruleset bypass?)"
          exit 1

      - name: Report an unrecorded signature
        if: failure() && steps.push.conclusion == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTRIBUTOR: ${{ github.event.comment.user.login }}
        with:
          script: |
            const contributor = process.env.CONTRIBUTOR;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thanks @' + contributor + '. Your acceptance is noted in this comment thread, but the signature could not be recorded in `.clabot` automatically. A maintainer will add it; no action is needed from you.'
            });

      - name: Trigger CLA recheck
        if: steps.add-contributor.outputs.already_signed == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTRIBUTOR: ${{ github.event.comment.user.login }}
        with:
          script: |
            const contributor = process.env.CONTRIBUTOR;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thanks @' + contributor + '! Your CLA signature has been recorded.\n\n@cla-bot check'
            });
