[project]
name = "orcaster-server"
version = "2.0.0"
description = "Orcaster server: task queue, scheduling and web console for a fleet of Orcaster workers"
license = "Apache-2.0"
authors = [{ name = "AInvirion LLC" }]
keywords = ["orcaster", "task-queue", "orchestrator", "distributed"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    "cryptography>=50",
    "jinja2>=3.1",
    "webauthn>=2.5",
    "python-multipart>=0.0.20",
]

[project.scripts]
orcaster-server = "orcaster_server.cli.server:main"
orcaster-migrate = "orcaster_server.cli.migrate:main"
orcaster-bootstrap-owner = "orcaster_server.cli.bootstrap:main"
orcaster-task-secrets-keys = "orcaster_server.cli.task_secrets_keys:main"
orcaster-workspace-quota = "orcaster_server.cli.workspace_quota:main"
orcaster-dev-invite = "orcaster_server.cli.dev_invite:main"

[project.urls]
Homepage = "https://github.com/AInvirion/orcaster"
Source = "https://github.com/AInvirion/orcaster"
Issues = "https://github.com/AInvirion/orcaster/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "cbor2>=5.6.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orcaster_server", "app"]

# Public sdist: code, migrations and scripts. No tests/ or .env.example.
[tool.hatch.build.targets.sdist]
only-include = ["orcaster_server", "app", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
